name: MLops pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: dvc-surya-bucket

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate dataset
        run: python generate_data.py
      
      - name: Train model
        run: |
          mkdir -p models
          python train.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        
      - name: Push model to S3 directly
        run: |
          aws s3 cp models/churn_model.pkl s3://dvc-surya-bucket/models/churn_model_v2.pkl
          echo "Model pushed to S3 is success"
      
      - name: Update inference.yaml with S3 model path
        run: |
          MODEL_URI="s3://dvc-surya-bucket/models/churn_model_v2.pkl"
          sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" yamls/inference.yaml

      - name: Commit updated inference.yaml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/inference.yaml
          git commit -m "Update model S3 path [skip ci]" || echo "No changes"
          git push || echo "No changes to push"
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  annotations:
    serving.kserve.io/s3-endpoint: "s3.eu-north-1.amazonaws.com"
    serving.kserve.io/s3-usehttps: "1"
    serving.kserve.io/s3-region: "eu-north-1"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-sa
secrets:
  - name: s3-secret